services:

  juice-shop:
    image: bkimminich/juice-shop
    container_name: juice-shop
    restart: unless-stopped

    expose:
      - "3000"

    networks:
      - lab-net


  waap:
    image: owasp/modsecurity-crs:nginx
    container_name: waap
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      BACKEND: http://juice-shop:3000

    depends_on:
      - juice-shop

    networks:
      - lab-net
    volumes:
      - ./waap/modsecurity-override.conf:/etc/modsecurity.d/modsecurity-override.conf

networks:
  lab-net:
    driver: bridge
