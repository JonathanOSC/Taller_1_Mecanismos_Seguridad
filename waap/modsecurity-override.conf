# ============================================================
# Lago WAAP - Ajustes específicos para OWASP Juice Shop
# ============================================================
#
# Juice Shop utiliza Socket.IO para comunicación en tiempo real.
# Algunas solicitudes legítimas de Socket.IO son detectadas por:
#
# 920350 - Host header is a numeric IP address
# 920420 - Request content type is not allowed by policy
#
# La exclusión está limitada exclusivamente a /socket.io/
# y se aplica por transacción.
#

SecRule REQUEST_URI "@beginsWith /socket.io/" "id:1001001,phase:1,pass,nolog,ctl:ruleRemoveById=920350,ctl:ruleRemoveById=920420"
